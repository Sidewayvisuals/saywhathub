
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Say What Hub – Viral entertainment and spectacular moments. Find all important links and legal information here.">

    <meta name="theme-color" content="#0b0b10">

    <title>Say What Hub | Official Links</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0b10;
            color: #e8e8ed;
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.7;
        }

        .landing-container {
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
            padding: 50px 45px 35px;
            text-align: center;
            background: #14141c;
            border: 1px solid #292936;
            border-radius: 16px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
        }

        .brand-logo {
            display: block;
            width: 66px;
            height: 66px;
            margin: 0 auto 22px;
            object-fit: contain;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 38px;
            font-weight: 800;
            letter-spacing: -1.5px;
            line-height: 1.2;
            background: linear-gradient(
                90deg,
                #00e5ff,
                #9b5cff,
                #ff36c5
            );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .tagline {
            margin: 0 auto;
            max-width: 390px;
            color: #b8b8c5;
            font-size: 15px;
        }

        .accent-line {
            width: 55px;
            height: 3px;
            margin: 30px auto;
            border-radius: 3px;
            background: linear-gradient(
                90deg,
                #00e5ff,
                #9b5cff,
                #ff36c5
            );
        }

        .section-label {
            margin: 0 0 17px;
            color: #9292a5;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .link-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-button {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 60px;
            padding: 15px 48px;
            border: 1px solid #393647;
            border-radius: 10px;
            background: #1c1b27;
            color: #f2f0fa;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            transition:
                border-color 0.2s ease,
                background 0.2s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .link-button::after {
            content: "↗";
            position: absolute;
            right: 20px;
            color: #00d9ff;
            font-size: 19px;
            transition: transform 0.2s ease;
        }

        .link-button:hover {
            border-color: #9b5cff;
            background: #242132;
            box-shadow: 0 0 22px rgba(155, 92, 255, 0.12);
            transform: translateY(-2px);
        }

        .link-button:hover::after {
            transform: translate(3px, -3px);
            color: #ff36c5;
        }

        .link-button:focus-visible {
            outline: 2px solid #00e5ff;
            outline-offset: 4px;
        }

        .contact {
            margin-top: 30px;
            color: #9292a5;
            font-size: 13px;
        }

        .contact a {
            color: #00d9ff;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .contact a:hover {
            color: #ff36c5;
        }

        .footer {
            margin-top: 35px;
            padding-top: 20px;
            border-top: 1px solid #292936;
            color: #777783;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 14px;
            }

            .landing-container {
                padding: 38px 23px 25px;
            }

            h1 {
                font-size: 32px;
            }

            .brand-logo {
                width: 60px;
                height: 60px;
            }

            .link-button {
                min-height: 58px;
                font-size: 14px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <main class="landing-container">

        <img
            class="brand-logo"
            src="media/saywhathub.png"
            alt="Say What Hub Logo"
        >

        <h1>Say What Hub</h1>

        <p class="tagline">
            Viral Entertainment &amp; Spectacular Moments.
            <br>
            All the important links in one place.
        </p>

        <div class="accent-line"></div>

        <p class="section-label">Useful Links</p>

        <nav class="link-list" aria-label="Important links">

            <a
                class="link-button"
                href="https://sidewayvisuals.github.io/saywhathub/legal_notice.html">
                Legal Notice
            </a>

            <a
                class="link-button"
                href="https://sidewayvisuals.github.io/saywhathub/privacy_policy.html">
                Privacy Policy
            </a>

        </nav>

        <div class="contact">
            Business inquiries:
            <a href="mailto:saywhathub@sidewayvisuals.com">
                Contact us
            </a>
        </div>

        <footer class="footer">
            &copy; 2026 Say What Hub. All rights reserved.
        </footer>

    </main>

</body>
</html>
